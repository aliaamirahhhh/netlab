# network.yaml: your routed network, as data. A starting point to change into your own design.
#
#   python3 build_routed.py network.yaml      checks it, then builds it in Mininet
#   python3 make_page3.py network.yaml        checks it, then writes docs/week3/index.html
#
# Replace NNNN and every NN (see "Your addresses"). Don't put your full student ID here.
#
# Each LAN has one router (.1 on the LAN) and one host (.10).
# On each link, the first router named is .1 and the second is .2.
# This starting point is the lab's network without r3. It works, but it doesn't meet the
# assignment's requirements: that's your job.

student_id_last4: "2380"

routers: [r1, r2, r3, r4]

lans:
  - name: lan-h1
    network: 10.80.1.0/24
    router: r1
    host: h1

  - name: lan-h2
    network: 10.80.32.0/24
    router: r2
    host: h2

  - name: lan-h3
    network: 10.80.33.0/24
    router: r3
    host: h3

  - name: lan-h4
    network: 10.80.2.0/24
    router: r4
    host: h4


links:
  - [r1, r2, 10.80.12.0/30]
  - [r1, r3, 10.80.13.0/30]
  - [r2, r4, 10.80.24.0/30]
  - [r3, r4, 10.80.34.0/30]

routes:
  r1:
    - to: 10.80.32.0/23
      via: 10.80.12.2
    - to: 10.80.2.0/24
      via: 10.80.12.2
   
  r2:
    - to: 10.80.1.0/24
      via: 10.80.12.1
    - to: 10.80.1.0/24
      via: 10.80.24.2
    - to: 10.80.33.0/24
      via: 10.80.24.2

  r3:
    - to: 10.80.1.0/24
      via: 10.80.13.1
    - to: 10.80.2.0/24
      via: 10.80.34.2
    - to: 10.80.32.0/24
      via: 10.80.34.2

  r4:
    - to: 10.80.1.0/24
      via: 10.80.24.1
    - to: 10.80.32.0/24
      via: 10.80.24.1
    - to: 10.80.33.0/24
      via: 10.80.34.1